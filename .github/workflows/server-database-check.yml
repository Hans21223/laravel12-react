name: Inspect database migration prerequisites
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            command -v mysql || true
            command -v mysqldump || true
            mysql --version || true
            mysql --batch --skip-column-names -e 'SELECT VERSION();' || true
            systemctl is-active mysql || true
            php -r 'echo "PDO_MYSQL=".(extension_loaded("pdo_mysql") ? "yes" : "no").PHP_EOL;'
            df -h /var/www
            dpkg-query -W coturn 2>/dev/null || true
            systemctl is-active coturn || true
            ss -lunt | head -20
            ufw status || true
            ip -4 -brief address
            echo '--- mail readiness (no secrets) ---'
            grep -E '^MAIL_(MAILER|HOST|PORT|SCHEME|FROM_ADDRESS)=' /var/www/Helldriver.csbootstrap.com/laravel12-react/.env || true
            command -v sendmail || true
            systemctl is-active postfix || true
            for target in smtp.gmail.com:587 smtp.gmail.com:465 gmail-smtp-in.l.google.com:25 smtp.resend.com:587; do
              host=${target%:*}; port=${target#*:}
              if timeout 6 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then echo "OUTBOUND_OPEN $target"; else echo "OUTBOUND_BLOCKED $target"; fi
            done
            systemctl is-active ae-reverb || true
            echo '--- turn relay (secrets removed) ---'
            grep -v -E 'secret' /etc/turnserver.conf || true
            ss -lunp | grep -E 'turnserver|:3478' | head -5 || true
            journalctl -u coturn --since '-45 min' --no-pager 2>/dev/null | grep -Ei 'error|denied|forbidden|quota|peer|permission|refused|allocation' | tail -40 || true
