name: Deploy Anaheim Electronics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helldriver-production
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect existing application without changing it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            php -v | head -n 2
            node --version
            composer --version
            python3 - <<'PY'
            import subprocess,re,pathlib
            result=subprocess.run(['nginx','-T'],capture_output=True,text=True,check=True)
            roots=set()
            for block in re.split(r'(?=\bserver\s*\{)',result.stdout):
                if re.search(r'server_name\s+[^;]*\bhelldriver\.csbootstrap\.com\b',block,re.I):
                    found=re.search(r'\broot\s+([^;]+);',block)
                    if found: roots.add(found.group(1).strip())
            for root in sorted(roots):
                app=pathlib.Path(root).resolve().parent
                print('APP_PATH:',app)
                print('ARTISAN_EXISTS:',(app/'artisan').is_file())
                if (app/'.env').exists():
                    env=(app/'.env').read_text()
                    for key in ['APP_ENV','APP_DEBUG','APP_URL','DB_CONNECTION']:
                        match=re.search(r'^'+key+r'=(.*)$',env,re.M)
                        print(key+':',match.group(1) if match else 'unset')
                if (app/'.git').exists():
                    for args in [['rev-parse','HEAD'],['status','--porcelain']]:
                        p=subprocess.run(['git','-C',str(app),*args],capture_output=True,text=True)
                        print('GIT',args[0]+':',p.stdout[:3000])
            if len(roots)!=1: raise SystemExit('Expected exactly one site document root')
            PY
