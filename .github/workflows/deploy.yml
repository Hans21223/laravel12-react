name: Deploy Anaheim Electronics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: helldriver-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run check:i18n && npm run build && php artisan test
      - name: Transfer, back up, and deploy using one SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_STAGE: /tmp/anaheim-${{ github.run_id }}-${{ github.run_attempt }}
          INITIAL_MANAGER_HASH: ${{ secrets.AE_INITIAL_MANAGER_HASH }}
          AE_MAIL_USERNAME: ${{ secrets.AE_MAIL_USERNAME }}
          AE_MAIL_PASSWORD: ${{ secrets.AE_MAIL_PASSWORD }}
        run: python3 scripts/deploy-transport.py
      - name: Verify the public application
        run: python3 scripts/check-deployment.py
