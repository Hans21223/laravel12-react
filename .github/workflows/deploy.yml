name: Deploy Anaheim Electronics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: helldriver-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run check:i18n && npm run build && php artisan test
      - name: Package tested assets
        run: tar -czf ae-build.tar.gz public/build scripts/deploy-server.sh scripts/deploy-database.php
      - name: Transfer assets to deployment staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ae-build.tar.gz
          target: /tmp/anaheim-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Back up and deploy the tested commit
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_STAGE: /tmp/anaheim-${{ github.run_id }}-${{ github.run_attempt }}
          INITIAL_MANAGER_HASH: ${{ secrets.AE_INITIAL_MANAGER_HASH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,DEPLOY_STAGE,INITIAL_MANAGER_HASH
          command_timeout: 12m
          script: |
            set -eu
            cd "$DEPLOY_STAGE"
            tar -xzf ae-build.tar.gz
            bash scripts/deploy-server.sh
      - name: Verify the public application
        run: |
          curl --fail --silent --show-error --retry 3 https://helldriver.csbootstrap.com/up
          curl --fail --silent --show-error https://helldriver.csbootstrap.com/ | grep -q 'Approvals/Auth'
